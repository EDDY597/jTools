<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>快速翻译</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root">
    <div class="lang-bar">
      <select id="from">
        <option value="auto">自动检测</option>
        <option value="zh-CN">中文</option>
        <option value="en">英语</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="ru">俄语</option>
        <option value="es">西语</option>
      </select>
      <button id="swap" title="交换语言">⇄</button>
      <select id="to">
        <option value="zh-CN">中文</option>
        <option value="en">英语</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="ru">俄语</option>
        <option value="es">西语</option>
      </select>
      <span id="detected" class="detected"></span>
      <span class="spacer"></span>
      <span id="provider" class="provider"></span>
    </div>

    <div id="result-wrap">
      <div id="result">输入文本即时翻译，中英自动互译</div>
      <div id="placeholder-hint">按 Esc 返回搜索 · Ctrl+C 点击下方按钮复制结果</div>
    </div>

    <div class="actions">
      <button class="btn" id="btn-copy">复制结果</button>
      <button class="btn secondary" id="btn-out">退出插件 (Esc)</button>
    </div>
  </div>
  <script src="api.js"></script>
  <script src="main.js"></script>
</body>
</html>

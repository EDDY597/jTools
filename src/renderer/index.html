<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>jTools</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="search-box">
      <div id="logo-mark">jT</div>
      <div id="plugin-pill" class="hidden">
        <img id="pill-logo" alt="" />
        <span class="pill-name" id="pill-name"></span>
        <span class="pill-close" id="pill-close">✕</span>
      </div>
      <select id="type-filter" title="搜索类型">
        <option value="all">全部</option>
        <option value="app">应用</option>
        <option value="file">文件</option>
        <option value="dir">文件夹</option>
        <option value="plugin">插件</option>
      </select>
      <div id="input-wrap">
        <span id="placeholder-text"></span>
        <input id="search-input" autocomplete="off" spellcheck="false" />
      </div>
      <span id="esc-hint" class="hidden">Esc</span>
      <button id="settings-btn" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
        </svg>
      </span>
    </div>

    <div id="results"></div>

    <iframe id="plugin-view"></iframe>

    <div id="settings-view"></div>
  </div>

  <script src="vendor/pinyin-pro.js"></script>
  <script src="app.js"></script>
</body>
</html>
